server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API ของโมดูล — ส่งต่อไปที่ Express (ชื่อ service ใน docker-compose)
    location /api/ {
        proxy_pass http://api:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ดึงรายการถึงจุดสั่งซื้อของทั้งคลังใช้เวลาได้หลายสิบวินาที (เรียก DB function
        # ต่อรายการ) — ตั้ง timeout ให้ยาวกว่า statement_timeout ของ pool (60 วินาที)
        proxy_read_timeout 90s;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
